const GRID = DATA.grid;
const BACKENDS = ["jev", "laya", "qwen"].filter(b => DATA.results[b]);
const NAMES = { jev: "Jev", laya: "Laya", qwen: "Jev-style Qwen" };
const MODELS = DATA.models || {};
const TAGS = { jev: "OpenCode Zen &middot; " + (MODELS.jev || "jev-1.13-free"),
               laya: "nucbox RTX 3060 &middot; " + (MODELS.laya || "laya-rl-agent"),
               qwen: "LM Studio &middot; " + (MODELS.qwen || "jev-style-qwen3.5-2b-decision") };
const COLORS = { jev: "#4ade80", laya: "#f5a623", qwen: "#a78bfa" };
let gameIdx = 0, frameIdx = {}, playing = true, speed = 2, timer = null;
BACKENDS.forEach(b => frameIdx[b] = 0);

// build panels
const arena = document.getElementById("arena");
BACKENDS.forEach(b => {
  const d = document.createElement("div");
  d.className = "panel";
  d.innerHTML = '<h2 style="color:' + COLORS[b] + '">' + NAMES[b] +
    ' <span class="tag">' + TAGS[b] + '</span></h2>' +
    '<div class="statline" id="stats-' + b + '"></div>' +
    '<div class="dead"><canvas id="cv-' + b + '" width="360" height="360"></canvas>' +
    '<div class="overlay" id="ov-' + b + '" style="display:none"></div></div>';
  arena.appendChild(d);
});

document.getElementById("matchinfo").textContent =
  "Recorded " + DATA.stamp.replace(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})$/, "$1-$2-$3 $4:$5:$6") +
  " · " + GRID + "x" + GRID + " board · one model call per move";

function game(b) { return DATA.results[b][gameIdx]; }
function frame(b) { return game(b).frames[Math.min(frameIdx[b], game(b).frames.length - 1)]; }

function draw(b) {
  const cv = document.getElementById("cv-" + b), ctx = cv.getContext("2d");
  const f = frame(b), n = GRID, cell = cv.width / n;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = "#1c2630"; ctx.lineWidth = 1;
  for (let i = 1; i < n; i++) {
    ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, cv.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(cv.width, i * cell); ctx.stroke();
  }
  if (f.food) {
    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc((f.food[0] + .5) * cell, (f.food[1] + .5) * cell, cell * .38, 0, 7);
    ctx.fill();
  }
  f.snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? COLORS[b] : COLORS[b] + "aa";
    const p = cell * .12;
    ctx.fillRect(s[0] * cell + p, s[1] * cell + p, cell - 2 * p, cell - 2 * p);
  });
  const done = frameIdx[b] >= game(b).frames.length - 1;
  const ov = document.getElementById("ov-" + b);
  if (done && game(b).death) {
    ov.style.display = "flex";
    ov.textContent = "DIED · " + game(b).death.replace("_", " ").toUpperCase();
  } else if (done) {
    ov.style.display = "flex"; ov.textContent = "SURVIVED";
  } else ov.style.display = "none";
  const lat = f.lat_ms ? f.lat_ms + " ms" : "—";
  document.getElementById("stats-" + b).innerHTML =
    "Score <b>" + f.score + "</b> Step <b>" + f.steps + "</b> Last move <b>" + lat + "</b>" +
    (f.err ? ' <b style="color:#ef4444">err</b>' : "");
}

function tick() {
  let alive = false;
  BACKENDS.forEach(b => {
    if (frameIdx[b] < game(b).frames.length - 1) { frameIdx[b]++; alive = true; }
    draw(b);
  });
  if (!alive) setPlaying(false);
}

function setPlaying(p) {
  playing = p;
  document.getElementById("playbtn").innerHTML = playing ? "&#10074;&#10074; Pause" : "&#9654; Play";
  if (timer) clearInterval(timer);
  if (playing) timer = setInterval(tick, 500 / speed);
}

function selectGame(i) {
  gameIdx = i;
  BACKENDS.forEach(b => frameIdx[b] = 0);
  document.querySelectorAll("#gamebtns button").forEach((el, j) =>
    el.classList.toggle("active", j === i));
  BACKENDS.forEach(draw);
  setPlaying(true);
}

DATA.results[BACKENDS[0]].forEach((g, i) => {
  const btn = document.createElement("button");
  btn.textContent = "Game " + (i + 1);
  btn.onclick = () => selectGame(i);
  document.getElementById("gamebtns").appendChild(btn);
});

document.getElementById("playbtn").onclick = () => setPlaying(!playing);
document.getElementById("restartbtn").onclick = () => selectGame(gameIdx);
document.getElementById("speed").oninput = e => {
  speed = parseFloat(e.target.value);
  document.getElementById("speedval").textContent = speed + "x";
  if (playing) setPlaying(true);
};

// stats table + verdict
let rows = "", tot = {};
BACKENDS.forEach(b => {
  tot[b] = { lat: [], food: 0, steps: 0, err: 0 };
  DATA.results[b].forEach((g, i) => {
    const l = g.lat;
    tot[b].lat.push(...g.frames.slice(1).map(f => f.lat_ms).filter(x => x > 0));
    tot[b].food += g.score; tot[b].steps += g.steps; tot[b].err += g.errors;
    rows += "<tr><td>" + NAMES[b] + "</td><td>" + (i + 1) +
      "</td><td>" + g.score + "</td><td>" + g.steps + "</td><td>" +
      (g.death ? "died: " + g.death.replace("_", " ") : "survived") + "</td><td>" +
      l.avg_ms + " ms</td><td>" + l.p95_ms + " ms</td><td>" + g.errors + "</td></tr>";
  });
});
document.getElementById("stattable").innerHTML += rows;
function avg(a) { return a.length ? (a.reduce((x, y) => x + y, 0) / a.length) : 0; }
const spd = BACKENDS.map(b => [b, avg(tot[b].lat)]).sort((a, b) => a[1] - b[1]);
const skl = BACKENDS.map(b => [b, tot[b].food]).sort((a, b) => b[1] - a[1]);
let v = "<b>Speed:</b> " + spd.map(s => NAMES[s[0]] + " " + Math.round(s[1]) + " ms/move").join(" &lt; ") + ".";
v += "<br><b>Skill:</b> " + skl.map(s => NAMES[s[0]] + " ate " + tot[s[0]].food +
  " food over " + tot[s[0]].steps + " steps").join("; ") + ".";
document.getElementById("verdict").innerHTML = v;
document.getElementById("gen").textContent = new Date().toLocaleString();

selectGame(0);
</script>
